name: Check CLI subagent recommendations

on:
  pull_request:
    paths:
      - "copilot-cli/**"
      - ".github/workflows/check-cli-subagents.yml"
  push:
    branches: [main]
    paths:
      - "copilot-cli/**"
      - ".github/workflows/check-cli-subagents.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s copilot-cli/tests -v
